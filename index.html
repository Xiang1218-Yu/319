<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>世界模拟系统 - Objective World Layer</title>
    <style>
      :root {
        --panel-bg: rgba(255, 255, 255, 0.12);
        --accent: #667eea;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #050508;
        color: #e0e0e8;
        font-family: "Inter", system-ui, sans-serif;
        overflow: hidden;
      }
      #canvas-container {
        width: 100vw;
        height: 100vh;
      }

      /* 仪表盘样式 - 极致克制 */
      #ui-layer {
        position: fixed;
        top: 24px;
        right: 24px;
        width: 300px;
        background: var(--panel-bg);
        -webkit-backdrop-filter: blur(16px);
        backdrop-filter: blur(16px);
        padding: 24px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        z-index: 100;
      }
      h2 {
        font-size: 12px;
        font-weight: 400;
        color: #888;
        letter-spacing: 2px;
        margin-bottom: 24px;
        text-transform: uppercase;
      }
      .control-item {
        margin-bottom: 18px;
      }
      .control-item label {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        margin-bottom: 8px;
        color: #aaa;
      }
      .control-item span {
        font-family: monospace;
        color: var(--accent);
      }
      .label-group {
        display: flex;
        align-items: center;
      }
      .help-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.2);
        font-size: 10px;
        font-family: "Inter", sans-serif;
        font-style: normal;
        font-weight: 500;
        margin-left: 6px;
        cursor: pointer;
        color: #888;
        transition: all 0.3s;
        position: relative;
        padding-bottom: 1px; /* 微调视觉中心 */
      }
      .help-icon:hover {
        background: var(--accent);
        color: white;
        border-color: var(--accent);
      }
      .help-icon::after {
        content: attr(data-tooltip);
        position: absolute;
        bottom: 180%;
        right: -20px;
        width: 200px;
        padding: 12px;
        background: rgba(10, 10, 15, 0.95);
        color: #ccd;
        font-size: 11px;
        line-height: 1.6;
        border-radius: 8px;
        pointer-events: none;
        opacity: 0;
        transform: translateY(10px);
        transition: all 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        border: 1px solid rgba(255, 255, 255, 0.1);
        text-transform: none;
        letter-spacing: 0;
        white-space: normal;
        z-index: 1000;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      }
      .help-icon:hover::after {
        opacity: 1;
        transform: translateY(0);
      }
      input[type="range"] {
        width: 100%;
        -webkit-appearance: none;
        appearance: none;
        background: rgba(255, 255, 255, 0.05);
        height: 2px;
        outline: none;
        transition: 0.3s;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 12px;
        height: 12px;
        background: var(--accent);
        border-radius: 50%;
        cursor: pointer;
        box-shadow: 0 0 10px var(--accent);
      }

      #stats-layer {
        position: fixed;
        bottom: 32px;
        left: 32px;
        font-family: monospace;
        font-size: 11px;
        line-height: 1.8;
        color: rgba(255, 255, 255, 0.5);
        letter-spacing: 1px;
        pointer-events: none;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
      }
      #stats-layer span {
        color: var(--accent);
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div id="canvas-container"></div>

    <div id="ui-layer">
      <h2>世界状态参数 (World State)</h2>
      <div class="control-item">
        <label for="coherence">
          <span class="label-group"
            >一致性 (Coherence)
            <i
              class="help-icon"
              data-tooltip="引导粒子向潜在线索聚合的引力程度。一致性越高，隐藏的世界秩序越容易由于粒子的共鸣而自发显现。"
              >?</i
            ></span
          >
          <span id="v-coherence">0.00</span>
        </label>
        <input
          type="range"
          id="coherence"
          min="0"
          max="100"
          value="10"
          title="调整世界的一致性程度"
        />
      </div>
      <div class="control-item">
        <label for="turbulence">
          <span class="label-group"
            >混乱度 (Turbulence)
            <i
              class="help-icon"
              data-tooltip="扰乱空间流动的随机力量。强大的混乱会撕裂已经形成的结构，使世界回归到无意义的美。"
              >?</i
            ></span
          >
          <span id="v-turbulence">0.00</span>
        </label>
        <input
          type="range"
          id="turbulence"
          min="0"
          max="100"
          value="80"
          title="调整世界的混乱强度"
        />
      </div>
      <div class="control-item">
        <label for="symmetry">
          <span class="label-group"
            >对称性 (Symmetry)
            <i
              class="help-icon"
              data-tooltip="控制空间能量的左右平衡。高对称性会将有机的漂移形态转化为理性的几何结构，赋予世界一种圣洁的秩序感。"
              >?</i
            ></span
          >
          <span id="v-symmetry">0.00</span>
        </label>
        <input
          type="range"
          id="symmetry"
          min="0"
          max="100"
          value="0"
          title="调整世界的空间对称平衡"
        />
      </div>
      <div class="control-item">
        <label for="colorTemp">
          <span class="label-group"
            >色温 (Color Temp)
            <i
              class="help-icon"
              data-tooltip="调节世界的光致色温。它决定了记忆在空间中折射出的情感底色，从清冷的幽蓝跨越到温暖的余烬金。"
              >?</i
            ></span
          >
          <span id="v-colorTemp">0.00</span>
        </label>
        <input
          type="range"
          id="colorTemp"
          min="0"
          max="100"
          value="50"
          title="调整世界的整体色彩温度"
        />
      </div>
    </div>

    <div id="stats-layer">
      客观世界层：系统运行中<br />
      结构场线索: 圣诞树<br />
      当前世界和谐度: <span id="s-harmony">0.00</span><br />
      历史最大和谐度: <span id="s-memory">0.00</span><br />
      模拟运行周期: <span id="s-time">0.00</span>s
    </div>

    <!-- 资源加载 -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";

      // ============================================
      // 1. TimeSystem - 时间与脉冲系统
      // ============================================
      class TimeSystem {
        constructor() {
          this.clock = new THREE.Clock();
          this.worldTime = 0;
          this.deltaTime = 0;
        }
        update() {
          this.deltaTime = Math.min(this.clock.getDelta(), 0.05); // 防止大跳帧
          this.worldTime += this.deltaTime;
        }
        getPulse(freq = 0.5) {
          // 用于“呼吸”感的正弦波
          return Math.sin(this.worldTime * Math.PI * 2 * freq) * 0.5 + 0.5;
        }
      }

      // ============================================
      // 2. FieldSystem - 连续动力学场
      // ============================================
      class FieldSystem {
        constructor() {
          this.time = 0;
        }
        // 增强版缥缈流场：结合多尺度正弦波模拟大尺度气流
        getNoise(pos, scale, strength) {
          const s1 = scale * 0.08;
          const s2 = scale * 0.2;
          const t = this.time * 0.4;

          // 大尺度波动
          const fx = Math.sin(pos.y * s1 + t) + Math.cos(pos.z * s1 + t * 0.5);
          const fy = Math.sin(pos.z * s1 + t) + Math.cos(pos.x * s1 + t * 0.8);
          const fz = Math.sin(pos.x * s1 + t) + Math.cos(pos.y * s1 + t * 1.2);

          // 小尺度细节
          const dx = Math.sin(pos.z * s2 - t);
          const dy = Math.cos(pos.x * s2 + t);
          const dz = Math.sin(pos.y * s2 - t * 0.5);

          return new THREE.Vector3(
            fx + dx * 0.3,
            fy + dy * 0.3,
            fz + dz * 0.3,
          ).multiplyScalar(strength);
        }
        update(deltaTime) {
          this.time += deltaTime;
        }
      }

      // ============================================
      // 3. StructureSystem - SDF 结构定义 (圣诞树)
      // ============================================
      class StructureSystem {
        constructor() {
          this.intensity = 0; // 结构允许显现的强度
          this.treeHeight = 12.0;
          this.treeRadius = 5.0;
        }
        // 圣诞树的 SDF 近似 (分层圆锥项目)
        getSDF(pos) {
          const h = this.treeHeight;
          const yOffset = pos.y + h / 2; // 将坐标映射到 0 -> h

          if (yOffset < 0 || yOffset > h) return 5.0;

          const yNorm = yOffset / h;

          // 分层逻辑：将树分为 4 个主要层级
          const numTiers = 4.0;
          const tier = Math.floor(yNorm * numTiers);
          const tierProgression = (yNorm * numTiers) % 1.0; // 每一层内部的进度 (0->1)

          // 每层底部的基础半径随高度减小
          const tierBaseRadius =
            this.treeRadius * (1.1 - (tier / numTiers) * 0.8);
          // 每一层呈锥形收缩
          const targetRadius = tierBaseRadius * (1.0 - tierProgression * 0.8);

          const radial = Math.sqrt(pos.x * pos.x + pos.z * pos.z);
          return radial - targetRadius;
        }

        getAttraction(pos) {
          if (this.intensity < 0.01) return new THREE.Vector3();

          const dist = this.getSDF(pos);

          // 计算 SDF 梯度（法线方向）
          const eps = 0.1;
          const d_dx =
            this.getSDF({ x: pos.x + eps, y: pos.y, z: pos.z }) - dist;
          const d_dy =
            this.getSDF({ x: pos.x, y: pos.y + eps, z: pos.z }) - dist;
          const d_dz =
            this.getSDF({ x: pos.x, y: pos.y, z: pos.z + eps }) - dist;

          // 梯度指向数值增加的方向（远离结构），所以我们要反向吸引
          const normal = new THREE.Vector3(d_dx, d_dy, d_dz).normalize();

          // 吸引力强度与距离相关：距离越远吸引力越大，但超过一定范围会衰减以保持缥缈感
          const forceStrength = -dist * Math.exp(-Math.abs(dist) * 0.4);

          return normal.multiplyScalar(forceStrength * this.intensity * 8.0);
        }
      }

      // ============================================
      // 4. MemorySystem - 世界惯性与记忆
      // ============================================
      class MemorySystem {
        constructor() {
          this.currentHarmony = 0;
          this.maxHarmony = 0;
          this.historyWeight = 0;
        }
        update(alignmentScore, deltaTime) {
          // 当前和谐度是由物理聚合状态决定的
          this.currentHarmony = THREE.MathUtils.lerp(
            this.currentHarmony,
            alignmentScore,
            deltaTime * 2.0,
          );

          if (this.currentHarmony > this.maxHarmony) {
            this.maxHarmony = this.currentHarmony;
          }
          // 如果曾经达到过高一致性，未来稳定速度会变快
          this.historyWeight = THREE.MathUtils.lerp(
            this.historyWeight,
            this.maxHarmony,
            deltaTime * 0.1,
          );
        }
      }

      // ============================================
      // 5. ParticleSystem - 粒子演化引擎
      // ============================================
      class ParticleEntity {
        constructor() {
          this.position = new THREE.Vector3(
            (Math.random() - 0.5) * 30,
            (Math.random() - 0.5) * 30,
            (Math.random() - 0.5) * 30,
          );
          this.velocity = new THREE.Vector3();
          this.orientation = new THREE.Vector3(0, 1, 0); // 倾向方向
          this.will = 0.5 + Math.random() * 0.5; // 内在驱动力倾向
          this.affinity = Math.random();
          this.life = Math.random();
          this.color = new THREE.Color();
        }
      }

      class ParticleSystem {
        constructor(count = 8000) {
          this.entities = Array.from(
            { length: count },
            () => new ParticleEntity(),
          );
          this.count = count;
          this.alignmentScore = 0; // 当前物理聚合评分
        }
        update(deltaTime, field, structure, params) {
          const worldCoherence = params.coherence;
          const turbulence = params.turbulence;
          const symmetry = params.symmetry;

          let totalDistScore = 0;

          for (let p of this.entities) {
            // ... 之前的场逻辑 ...
            const dist = structure.getSDF(p.position);
            // 粒子距离结构越近，贡献的聚合评分越高 (高斯衰减)
            totalDistScore += Math.exp(-Math.abs(dist) * 1.5);

            // 1. 场的作用
            let noise = field.getNoise(p.position, 2.0, turbulence * 1.5);

            // 对称性干预：如果对称性高，尝试镜像噪声场
            if (symmetry > 0.1) {
              const mirroredPos = new THREE.Vector3(
                -p.position.x,
                p.position.y,
                -p.position.z,
              );
              const mirroredNoise = field.getNoise(
                mirroredPos,
                2.0,
                turbulence * 1.5,
              );
              mirroredNoise.x *= -1; // 镜像方向
              mirroredNoise.z *= -1;
              noise.lerp(mirroredNoise, symmetry);
            }

            // 粒子倾向：它会尝试顺着噪声流动，但保有自己的“意志”惯性
            const tendencyForce = noise.clone().multiplyScalar(p.will);
            p.velocity.add(tendencyForce.multiplyScalar(deltaTime));

            // 2. 引力作用 (结构吸引)
            const structureIntensity = structure.intensity;
            if (structureIntensity > 0.01) {
              const attract = structure.getAttraction(p.position);
              // 亲和力决定了它有多向往结构
              p.velocity.add(
                attract.multiplyScalar(deltaTime * p.affinity * 6.0),
              );
            }

            // 3. 阻尼与平滑 - 降低阻尼以增加灵动感和贯性
            p.velocity.multiplyScalar(0.985);

            // 4. 更新倾向方向 (顺着速度方向，但平滑过渡)
            if (p.velocity.length() > 0.05) {
              const targetOrient = p.velocity.clone().normalize();
              p.orientation.lerp(targetOrient, deltaTime * 2.0);
            }

            // 5. 位置更新
            p.position.add(p.velocity.clone().multiplyScalar(deltaTime));

            // 6. 循环边界
            if (p.position.length() > 25) {
              p.position.multiplyScalar(-0.95); // 软回弹
              p.velocity.multiplyScalar(0.5);
            }
          }

          // 计算归一化的聚合评分，作为实际和谐度的基础
          this.alignmentScore = totalDistScore / this.count;
        }
      }

      // ============================================
      // 6. RenderSystem - WebGL 发光渲染
      // ============================================
      class RenderSystem {
        constructor(container, count) {
          this.scene = new THREE.Scene();
          this.camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000,
          );
          this.renderer = new THREE.WebGLRenderer({
            antialias: true,
            alpha: false,
          });

          this.renderer.setSize(window.innerWidth, window.innerHeight);
          this.renderer.setClearColor(0x020205, 1);
          container.appendChild(this.renderer.domElement);

          this.camera.position.z = 25;

          // Points Geometry
          this.geo = new THREE.BufferGeometry();
          this.posArray = new Float32Array(count * 3);
          this.velArray = new Float32Array(count * 3); // 传递速度用于拉伸
          this.colArray = new Float32Array(count * 3);
          this.sizeArray = new Float32Array(count);

          this.geo.setAttribute(
            "position",
            new THREE.BufferAttribute(this.posArray, 3),
          );
          this.geo.setAttribute(
            "velocity",
            new THREE.BufferAttribute(this.velArray, 3),
          );
          this.geo.setAttribute(
            "color",
            new THREE.BufferAttribute(this.colArray, 3),
          );
          this.geo.setAttribute(
            "size",
            new THREE.BufferAttribute(this.sizeArray, 1),
          );

          // Shader Material
          this.mat = new THREE.ShaderMaterial({
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            uniforms: {
              uTime: { value: 0 },
              uPulse: { value: 1.0 },
            },
            vertexShader: `
                        attribute float size;
                        attribute vec3 color;
                        attribute vec3 velocity;
                        varying vec3 vColor;
                        varying float vSpeed;
                        uniform float uTime;
                        uniform float uPulse;
                        
                        void main() {
                            vColor = color;
                            vSpeed = length(velocity);
                            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                            
                            // 缥缈感：速度越快，粒子越细长
                            float pSize = size * uPulse * (1.0 + vSpeed * 0.1);
                            
                            gl_PointSize = pSize * (250.0 / -mvPosition.z);
                            gl_Position = projectionMatrix * mvPosition;
                        }
                    `,
            fragmentShader: `
                        varying vec3 vColor;
                        varying float vSpeed;
                        uniform float uTime;
                        
                        void main() {
                            vec2 pc = gl_PointCoord - vec2(0.5);
                            
                            // 动态拉伸比例
                            float stretch = 1.6 + vSpeed * 0.4;
                            float dist = length(pc * vec2(1.0, stretch)); 
                            
                            // 显著增强粒子边缘的锐度，减少过度堆叠形成的“白屏”感
                            float strength = pow(clamp(1.0 - dist * 2.5, 0.0, 1.0), 4.5);
                            
                            if (strength <= 0.02) discard;
                            
                            // 速度脉冲：让运动中的粒子更有灵力感，静止汇聚时则内敛
                            float speedEffect = 1.0 + vSpeed * 0.05;
                            
                            // 加入更细碎的个体差异
                            float flicker = 0.85 + 0.15 * sin(uTime * 8.0 + vSpeed * 10.0);
                            
                            gl_FragColor = vec4(vColor * speedEffect, strength * flicker * 0.55);
                        }
                    `,
          });

          this.mesh = new THREE.Points(this.geo, this.mat);
          this.scene.add(this.mesh);

          window.addEventListener("resize", () => this.onResize());
        }

        onResize() {
          this.camera.aspect = window.innerWidth / window.innerHeight;
          this.camera.updateProjectionMatrix();
          this.renderer.setSize(window.innerWidth, window.innerHeight);
        }

        update(particles, params, pulse, structure) {
          const positions = this.geo.attributes.position.array;
          const velocities = this.geo.attributes.velocity.array;
          const colors = this.geo.attributes.color.array;
          const sizes = this.geo.attributes.size.array;

          const baseCol = new THREE.Color();
          // 色温：0 (冷紫) -> 1 (暖金)
          const cold = new THREE.Color(0.4, 0.4, 1.0);
          const warm = new THREE.Color(1.0, 0.7, 0.3);
          baseCol.copy(cold).lerp(warm, params.colorTemp);

          for (let i = 0; i < particles.entities.length; i++) {
            const p = particles.entities[i];
            const i3 = i * 3;

            positions[i3] = p.position.x;
            positions[i3 + 1] = p.position.y;
            positions[i3 + 2] = p.position.z;

            velocities[i3] = p.velocity.x;
            velocities[i3 + 1] = p.velocity.y;
            velocities[i3 + 2] = p.velocity.z;

            // 靠近结构的粒子不应该变大，否则会堵塞视觉，失去“粒子感”
            const dist = structure.getSDF(p.position);
            const proximity = Math.exp(-Math.abs(dist) * 1.5);

            // 颜色向结构色缓慢偏移，但不完全变成纯白
            const structureColor = new THREE.Color(0.8, 0.9, 1.0);
            const finalCol = baseCol
              .clone()
              .lerp(structureColor, proximity * structure.intensity * 0.7);

            colors[i3] = finalCol.r;
            colors[i3 + 1] = finalCol.g;
            colors[i3 + 2] = finalCol.b;

            // 关键：保持粒子微小，汇聚时才能看出是“无数粒子”组成的
            sizes[i] =
              0.8 + p.will * 0.5 + proximity * 0.3 * structure.intensity;
          }

          this.geo.attributes.position.needsUpdate = true;
          this.geo.attributes.velocity.needsUpdate = true;
          this.geo.attributes.color.needsUpdate = true;
          this.geo.attributes.size.needsUpdate = true;

          this.mat.uniforms.uPulse.value = 0.8 + 0.4 * pulse;
          this.mat.uniforms.uTime.value = performance.now() * 0.001;

          // 缓动相机
          const t = performance.now() * 0.0002;
          this.camera.position.x = Math.sin(t) * 5.0;
          this.camera.position.y = Math.cos(t) * 2.0;
          this.camera.lookAt(0, 0, 0);

          this.renderer.render(this.scene, this.camera);
        }
      }

      // ============================================
      // 7. WorldSimulation - 核心集成与对外接口
      // ============================================
      class WorldSimulation {
        constructor(container) {
          this.count = 8000;
          this.time = new TimeSystem();
          this.field = new FieldSystem();
          this.structure = new StructureSystem();
          this.memory = new MemorySystem();
          this.particles = new ParticleSystem(this.count);
          this.render = new RenderSystem(container, this.count);

          this.state = {
            coherence: 0.1,
            turbulence: 0.8,
            symmetry: 0,
            colorTemp: 0.5,
          };

          this.targetState = { ...this.state };
        }

        applyWorldParams(params) {
          Object.assign(this.targetState, params);
        }

        update() {
          this.time.update();
          const dt = this.time.deltaTime;
          const wt = this.time.worldTime;

          // 1. 参数平滑演进 (低通滤波)
          const lerpSpd = dt * 1.5;
          for (let key in this.state) {
            this.state[key] = THREE.MathUtils.lerp(
              this.state[key],
              this.targetState[key],
              lerpSpd,
            );
          }

          // 2. 状态映射到系统参数
          this.field.update(dt);

          // 3. 动力学演化 (更新粒子位置并计算聚合度)
          this.particles.update(dt, this.field, this.structure, this.state);

          // 4. 记忆系统更新 (使用实际聚合度作为和谐度来源)
          this.memory.update(this.particles.alignmentScore, dt);

          // 结构强度受 coherence 和 memory 的双重影响
          const memoryBonus = this.memory.historyWeight * 0.3;
          this.structure.intensity = Math.max(
            0,
            (this.state.coherence + memoryBonus - 0.5) * 2.0,
          );

          // 5. 渲染更新
          this.render.update(
            this.particles,
            this.state,
            this.time.getPulse(),
            this.structure,
          );

          // UI 数据同步
          this.syncUI();
        }

        syncUI() {
          document.getElementById("v-coherence").textContent =
            this.state.coherence.toFixed(2);
          document.getElementById("v-turbulence").textContent =
            this.state.turbulence.toFixed(2);
          document.getElementById("v-symmetry").textContent =
            this.state.symmetry.toFixed(2);
          document.getElementById("v-colorTemp").textContent =
            this.state.colorTemp.toFixed(2);

          // 显示基于物理状态的瞬时和谐度与历史峰值
          document.getElementById("s-harmony").textContent =
            this.memory.currentHarmony.toFixed(2);
          document.getElementById("s-memory").textContent =
            this.memory.maxHarmony.toFixed(2);
          document.getElementById("s-time").textContent =
            this.time.worldTime.toFixed(1);
        }
      }

      // ============================================
      // 驱动入口
      // ============================================
      const container = document.getElementById("canvas-container");
      const world = new WorldSimulation(container);

      function animate() {
        requestAnimationFrame(animate);
        world.update();
      }
      animate();

      // 绑定原生控制界面
      const ids = ["coherence", "turbulence", "symmetry", "colorTemp"];
      ids.forEach((id) => {
        document.getElementById(id).addEventListener("input", (e) => {
          const val = parseFloat(e.target.value) / 100;
          const update = {};
          update[id] = val;
          world.applyWorldParams(update);
        });
      });

      // 暴露接口到 window 方便调试
      window.worldLayer = world;
    </script>
  </body>
</html>
