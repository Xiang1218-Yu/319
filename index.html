<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>世界模拟系统 - Objective World Layer</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div id="canvasContainer"></div>

    <div id="uiLayer">
      <h2>世界状态参数 (World State)</h2>
      <div class="controlItem">
        <label for="coherence">
          <span class="labelGroup"
            >一致性 (Coherence)
            <i
              class="helpIcon"
              data-tooltip="引导粒子向潜在线索聚合的引力程度。一致性越高，隐藏的世界秩序越容易由于粒子的共鸣而自发显现。"
              >?</i
            ></span
          >
          <span id="vCoherence">0.00</span>
        </label>
        <input
          type="range"
          id="coherence"
          min="0"
          max="100"
          value="10"
          title="调整世界的一致性程度"
        />
      </div>
      <div class="controlItem">
        <label for="turbulence">
          <span class="labelGroup"
            >混乱度 (Turbulence)
            <i
              class="helpIcon"
              data-tooltip="扰乱空间流动的随机力量。强大的混乱会撕裂已经形成的结构，使世界回归到无意义的美。"
              >?</i
            ></span
          >
          <span id="vTurbulence">0.00</span>
        </label>
        <input
          type="range"
          id="turbulence"
          min="0"
          max="100"
          value="80"
          title="调整世界的混乱强度"
        />
      </div>
      <div class="controlItem">
        <label for="symmetry">
          <span class="labelGroup"
            >对称性 (Symmetry)
            <i
              class="helpIcon"
              data-tooltip="控制空间能量的左右平衡。高对称性会将有机的漂移形态转化为理性的几何结构，赋予世界一种圣洁的秩序感。"
              >?</i
            ></span
          >
          <span id="vSymmetry">0.00</span>
        </label>
        <input
          type="range"
          id="symmetry"
          min="0"
          max="100"
          value="0"
          title="调整世界的空间对称平衡"
        />
      </div>
      <div class="controlItem">
        <label for="colorTemp">
          <span class="labelGroup"
            >色温 (Color Temp)
            <i
              class="helpIcon"
              data-tooltip="调节世界的光致色温。它决定了记忆在空间中折射出的情感底色，从清冷的幽蓝跨越到温暖的余烬金。"
              >?</i
            ></span
          >
          <span id="vColorTemp">0.00</span>
        </label>
        <input
          type="range"
          id="colorTemp"
          min="0"
          max="100"
          value="50"
          title="调整世界的整体色彩温度"
        />
      </div>
    </div>

    <div id="statsLayer">
      客观世界层：系统运行中<br />
      结构场线索: 圣诞树<br />
      当前世界和谐度: <span id="sHarmony">0.00</span><br />
      历史最大和谐度: <span id="sMemory">0.00</span><br />
      模拟运行周期: <span id="sTime">0.00</span>s
    </div>

    <script>
      const cdnPrimary = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
      const cdnFallback = 'https://unpkg.com/three@0.160.0/build/three.module.js';

      function setImportMap(cdnUrl) {
        const importMap = document.createElement('script');
        importMap.type = 'importmap';
        importMap.textContent = JSON.stringify({
          imports: { three: cdnUrl },
        });
        document.currentScript.after(importMap);
      }

      function loadModule() {
        const moduleScript = document.createElement('script');
        moduleScript.type = 'module';
        moduleScript.src = 'js/main.js';
        document.body.appendChild(moduleScript);
      }

      function probeCdn(cdnUrl) {
        return new Promise((resolve) => {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 8000);
          fetch(cdnUrl, { method: 'HEAD', mode: 'no-cors', signal: controller.signal })
            .then(() => { clearTimeout(timeoutId); resolve(true); })
            .catch(() => { clearTimeout(timeoutId); resolve(false); });
        });
      }

      async function initApp() {
        const primaryOk = await probeCdn(cdnPrimary);
        const selectedCdn = primaryOk ? cdnPrimary : cdnFallback;
        setImportMap(selectedCdn);
        loadModule();
      }

      window.addEventListener('error', (event) => {
        if (event.message && event.message.includes('Failed to resolve module specifier')) {
          showFallbackUI('3D 引擎加载失败，请检查网络连接后刷新页面');
        }
      }, true);

      function showFallbackUI(message) {
        const container = document.getElementById('canvasContainer');
        if (container && !document.getElementById('fallbackMsg')) {
          const fallback = document.createElement('div');
          fallback.id = 'fallbackMsg';
          fallback.className = 'fallbackMsg';
          fallback.textContent = message;
          container.appendChild(fallback);
          const uiLayer = document.getElementById('uiLayer');
          if (uiLayer) uiLayer.style.display = 'none';
          const statsLayer = document.getElementById('statsLayer');
          if (statsLayer) statsLayer.style.display = 'none';
        }
      }

      window.showFallbackUI = showFallbackUI;

      initApp();
    </script>
  </body>
</html>
