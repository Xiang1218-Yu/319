<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>世界模拟系统 - Objective World Layer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="canvas-container"></div>

    <div id="ui-layer">
      <h2>世界状态参数 (World State)</h2>
      <div class="control-item">
        <label for="coherence">
          <span class="label-group"
            >一致性 (Coherence)
            <i
              class="help-icon"
              data-tooltip="引导粒子向潜在线索聚合的引力程度。一致性越高，隐藏的世界秩序越容易由于粒子的共鸣而自发显现。"
              >?</i
            ></span
          >
          <span id="v-coherence">0.00</span>
        </label>
        <input
          type="range"
          id="coherence"
          min="0"
          max="100"
          value="10"
          title="调整世界的一致性程度"
        />
      </div>
      <div class="control-item">
        <label for="turbulence">
          <span class="label-group"
            >混乱度 (Turbulence)
            <i
              class="help-icon"
              data-tooltip="扰乱空间流动的随机力量。强大的混乱会撕裂已经形成的结构，使世界回归到无意义的美。"
              >?</i
            ></span
          >
          <span id="v-turbulence">0.00</span>
        </label>
        <input
          type="range"
          id="turbulence"
          min="0"
          max="100"
          value="80"
          title="调整世界的混乱强度"
        />
      </div>
      <div class="control-item">
        <label for="symmetry">
          <span class="label-group"
            >对称性 (Symmetry)
            <i
              class="help-icon"
              data-tooltip="控制空间能量的左右平衡。高对称性会将有机的漂移形态转化为理性的几何结构，赋予世界一种圣洁的秩序感。"
              >?</i
            ></span
          >
          <span id="v-symmetry">0.00</span>
        </label>
        <input
          type="range"
          id="symmetry"
          min="0"
          max="100"
          value="0"
          title="调整世界的空间对称平衡"
        />
      </div>
      <div class="control-item">
        <label for="colorTemp">
          <span class="label-group"
            >色温 (Color Temp)
            <i
              class="help-icon"
              data-tooltip="调节世界的光致色温。它决定了记忆在空间中折射出的情感底色，从清冷的幽蓝跨越到温暖的余烬金。"
              >?</i
            ></span
          >
          <span id="v-colorTemp">0.00</span>
        </label>
        <input
          type="range"
          id="colorTemp"
          min="0"
          max="100"
          value="50"
          title="调整世界的整体色彩温度"
        />
      </div>
    </div>

    <div id="stats-layer">
      客观世界层：系统运行中<br />
      结构场线索: 圣诞树<br />
      当前世界和谐度: <span id="s-harmony">0.00</span><br />
      历史最大和谐度: <span id="s-memory">0.00</span><br />
      模拟运行周期: <span id="s-time">0.00</span>s
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
        }
      }
    </script>

    <script type="module" src="app.js"></script>
  </body>
</html>
